name: Check Actor Permissions
description: Check if an actor has a specific access to the repository
author: "prince-chrismc"
branding:
  icon: "check"
  color: "green"
outputs:
  permitted:
    description: "Set 'true' or 'false' depending on actor permission meeting the requirement"
inputs:
  github_token:
    description: A GitHub token.
    required: false
    default: ${{ github.token }}
  permission:
    description: The minimum permission level required
    required: true
  username:
    description: >-
      The user whose permission is checked. Defaults to the actor that started
      the workflow run. Pass `github.triggering_actor` to check the user that
      started a re-run.
    required: false
    default: ${{ github.actor }}
runs:
  using: "node20"
  main: "dist/index.js"
